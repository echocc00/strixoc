        </g>

        <g data-edge-from="validator" data-edge-to="exploit" data-edge-label="Pydantic validates · structured record returned / Pydantic 校验 · 结构化结果回传" data-edge-key="5" data-edge-id="m6-pydantic">
          <path data-composition-edge-from="validator" data-composition-edge-to="exploit" data-composition-edge-id="m6-pydantic" data-composition-points="746.75,660;558,660" d="M 746.75 660 L 558 660" class="a-default" style="stroke: #948978; fill: none" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
