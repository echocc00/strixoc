        <path d="M 551 142 L 551 855" class="a-default" style="stroke: #948978; fill: none" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 753.75 142 L 753.75 855" class="a-default" style="stroke: #948978; fill: none" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 956.5 142 L 956.5 855" class="a-default" style="stroke: #948978; fill: none" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activations -->


        <!-- Messages -->
        <g data-edge-from="operator" data-edge-to="recon" data-edge-label="declare scope · CLI targets + rules / 声明范围 · 规则与目标" data-edge-key="0" data-edge-id="m1-scope">
          <path data-composition-edge-from="operator" data-composition-edge-to="recon" data-composition-edge-id="m1-scope" data-composition-points="152.5,180;341.25,180" d="M 152.5 180 L 341.25 180" class="a-emphasis" style="stroke: #dd6b3d; fill: none" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="87.475" y="160" width="318.8" height="16" rx="3" class="c-mask" style="fill: #231f18; stroke: none"/>
          <text x="246.875" y="170" class="t-backend" style="fill: #8fc29e" font-size="9" text-anchor="middle">declare scope · CLI targets + rules / 声明范围 · 规则与目标</text>
        </g>
        </g>

        <g data-edge-from="recon" data-edge-to="operator" data-edge-label="scope acknowledged · recon started / 范围已确认 · 侦察启动" data-edge-key="1" data-edge-id="m2-scope-ack">
          <path data-composition-edge-from="recon" data-composition-edge-to="operator" data-composition-edge-id="m2-scope-ack" data-composition-points="341.25,280;152.5,280" d="M 341.25 280 L 152.5 280" class="a-default" style="stroke: #948978; fill: none" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
