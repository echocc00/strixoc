        <g data-edge-from="destination" data-edge-to="operator" data-edge-label="deliver to CI · ticket · compliance / 下发 CI · 工单 · 合规" data-edge-key="7" data-edge-id="m8-dispatch">
          <path data-composition-edge-from="destination" data-composition-edge-to="operator" data-composition-edge-id="m8-dispatch" data-composition-points="949.5,820;152.5,820" d="M 949.5 820 L 152.5 820" class="a-default" style="stroke: #948978; fill: none" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
