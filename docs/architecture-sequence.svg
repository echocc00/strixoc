        </g>
        </g>

        <g data-edge-from="validator" data-edge-to="destination" data-edge-label="aggregate + dedupe + emit report / 聚合 · 去重 · 生成报告" data-edge-key="6" data-edge-id="m7-aggregate">
          <path data-composition-edge-from="validator" data-composition-edge-to="destination" data-composition-edge-id="m7-aggregate" data-composition-points="760.75,760;949.5,760" d="M 760.75 760 L 949.5 760" class="a-emphasis" style="stroke: #dd6b3d; fill: none" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
