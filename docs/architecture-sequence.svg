        </g>
        </g>

        <g data-edge-from="exploit" data-edge-to="validator" data-edge-label="raw finding + evidence payload / 原始发现 + 证据载荷" data-edge-key="4" data-edge-id="m5-raw-finding">
          <path data-composition-edge-from="exploit" data-composition-edge-to="validator" data-composition-edge-id="m5-raw-finding" data-composition-points="558,580;746.75,580" d="M 558 580 L 746.75 580" class="a-emphasis" style="stroke: #dd6b3d; fill: none" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
