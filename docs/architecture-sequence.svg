        </g>
        </g>

        <g data-edge-from="exploit" data-edge-to="operator" data-edge-label="dynamic exploit within safety rails / 安全边界内动态利用" data-edge-key="3" data-edge-id="m4-exploit-rails">
          <path data-composition-edge-from="exploit" data-composition-edge-to="operator" data-composition-edge-id="m4-exploit-rails" data-composition-points="544,480;152.5,480" d="M 544 480 L 152.5 480" class="a-security" style="stroke: #df9085; fill: none; stroke-dasharray: 5,5" stroke-width="1.4" marker-end="url(#arrowhead-security)"/>
