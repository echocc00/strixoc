[project]
name = "hermes-strix-plugin"
version = "0.5.0"
description = "Hermes plugin x Strix autonomous pentest integration (CLI/gateway/Feishu reuse)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.11",
  "mypy>=1.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

# ---------------------------------------------------------------------------
# Ruff (0.3.0): conservative subset of the root repo's config - the plugin
# runs on hermes' Python 3.11, so target py311, not the root's py312.
# Rules tighten per release; anything ignored here is deliberate.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["strix_runs"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific
]
ignore = [
  "E501",  # line length: legacy lines exist; formatter will converge over time
  "SIM105", # try/except/pass used deliberately at resilience boundaries
]

[tool.ruff.lint.per-file-ignores]
# Tests exercise error paths on purpose and use fixed local paths.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
# Lenient baseline (0.3.0); tighten one notch per minor release - see DEV_PLAN.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
files = ["plugin"]

[[tool.mypy.overrides]]
module = ["hermes_cli.*", "tools.*", "strix.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["plugin"]
omit = ["plugin/worker.py"]  # thin process shim, exercised via runtime suites

[tool.coverage.report]
# Baseline floor 75%; DEV_PLAN raises this to 85% at 1.0.0.
fail_under = 75
show_missing = true
