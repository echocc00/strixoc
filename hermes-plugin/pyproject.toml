[project]
name = "hermes-strix-plugin"
version = "0.2.0"
description = "Hermes plugin x Strix autonomous pentest integration (CLI/gateway/Feishu reuse)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"