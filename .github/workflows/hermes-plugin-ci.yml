name: hermes-plugin CI

on:
  push:
    paths:
      - "hermes-plugin/**"
      - ".github/workflows/hermes-plugin-ci.yml"
  pull_request:
    paths:
      - "hermes-plugin/**"

jobs:
  test-py312-strix:
    name: py3.12 + strix (real artifact suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: hermes-plugin
        run: |
          python -m pip install --quiet --disable-pip-version-check \
            "strix-agent==1.5.3" pytest pytest-asyncio
      - name: Run tests
        working-directory: hermes-plugin
        run: python -m pytest tests/ -q

  test-py311:
    name: py3.11 (hermes-side only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: hermes-plugin
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest pytest-asyncio
      - name: Run tests (strix-optional suites auto-skip without strix)
        working-directory: hermes-plugin
        run: python -m pytest tests/ -q